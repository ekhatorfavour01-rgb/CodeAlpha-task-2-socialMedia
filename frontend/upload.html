<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111114">
    <meta name="api-base" content="">
    <title>Create a post — Loop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <script>window.MEDIA_API_URL = '';</script>
    
    <script src="api.js" defer></script>
    <script src="upload.js" defer></script>
  </head>
  <body class="app-page upload-page">
    <header class="topbar">
      <a class="brand" href="index.html" aria-label="Loop home"><span class="brand-mark">L</span><span>loop</span></a>
      <div class="topbar-center">Create something good</div>
      <nav class="top-actions" aria-label="Main navigation"><a class="button button-quiet" href="index.html">Cancel</a><a class="button button-primary" id="auth-link" href="login.html">Log in</a></nav>
    </header>
    <main class="upload-main">
      <div class="upload-intro"><p class="eyebrow">YOUR MOMENT, YOUR WAY</p><h1>Make it a post.</h1><p>Share a video, a photo, or a link with your people.</p></div>
      <form class="upload-card" id="upload-form">
        <label class="upload-dropzone" id="dropzone" for="media-file">
          <input class="sr-only" id="media-file" name="video" type="file" accept="video/*,image/*">
          <span class="upload-icon" aria-hidden="true">↥</span>
          <strong id="file-label">Drop your media here, or browse</strong>
          <span>Video or image · up to 50 MB</span>
          <div class="media-preview" id="media-preview" hidden></div>
        </label>
        <div class="upload-fields">
          <label>Caption <span class="optional">optional</span><textarea name="caption" id="caption" rows="4" maxlength="300" placeholder="What's the moment?"></textarea><span class="character-count"><span id="caption-count">0</span>/300</span></label>
          <div class="field-divider"><span>or share a link</span></div>
          <label>Media URL <span class="optional">optional</span><input name="mediaUrl" id="media-url" type="url" placeholder="https://…"><small>Use a direct video or image URL if you’re not uploading a file.</small></label>
          <p class="upload-hint" id="upload-hint">Choose a file or add a media URL to continue.</p>
          <button class="button button-primary button-wide" type="submit" id="publish-button"><span>Share post</span><span aria-hidden="true">→</span></button>
          <p class="form-message" id="upload-message" role="alert"></p>
        </div>
      </form>
    </main>
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
  </body>
</html>
